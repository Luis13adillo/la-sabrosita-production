<!-- Both faces, because both are on the first screen: Fredoka is the display
     face for the headline and every label in the hero, Noto Sans is the body
     face for the deck. brand.json typography.display / typography.body. -->
<link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-sans-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
<!-- Tied to the LANGUAGE, not to the page being built. These used to be
     {{home}} and {{otherHome}}, which are "this page" and "the other one" —
     correct on /, and exactly inverted on /en/, where it told search engines
     the Spanish version lived at /en/ and the English one at /. -->
<link rel="alternate" hreflang="es" href="{{esHome}}">
<link rel="alternate" hreflang="en" href="{{enHome}}">
<link rel="alternate" hreflang="x-default" href="{{esHome}}">
