<!-- 6. THREE BEATS ON A DOTTED PATH
     ===============================
     b.html section 6. Three cream cards on the electric-blue field, alternating
     sides, threaded on a dashed yellow path with a yellow bead in each gap —
     the sign's bulb motif, reused.

     All six lines of copy are drafted and chipped. The products they name are
     spelled the way menu.json spells them. -->
<section class="antojos" aria-labelledby="beats-h">
  <div class="antojos__head">
    <p><span class="kick">{{dia}}{{d:beatsKicker}}{{dia}}</span>{{draft}}</p>
    <h2 class="antojos__h" id="beats-h">{{d:beatsTitle}}{{draft}}</h2>
  </div>
  <div class="beats">{{beats}}</div>
</section>
{{dripstrip:electric-blue}}
