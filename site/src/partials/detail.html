<!-- THE SINGLE PRODUCT VIEW.

     A room, not a lightbox. The dialog fills the viewport and takes the
     product's own category colour as its field, so opening a product is
     arriving somewhere rather than having a box drawn over the menu.

     WHAT IS IN THE BODY, AND WHY YOU CANNOT SEE IT HERE. detail.js writes two
     children into [data-detail-body] and nothing else: the stage, which is the
     photograph on the field, and the reading panel. They are two grid columns
     that do not overlap — photograph left, words right — because round 3 ran the
     stage underneath the panel and the panel then covered 485px of the Paletas
     wrapper and 183px of the Nachos tray.

     ROUND 5: ON A DESKTOP SCREEN THE READING PANEL IS THE WHOLE COLUMN. It was a
     cream card anchored to the bottom-right corner, which left 528px by 350–620px
     of bare accent colour above it on all 45 products. The cream now runs the
     full height of the room and the seam between the two fields is the soft-wave
     motif brand.json's visual direction asks for. Nothing was written to fill it:
     the same elements this file has always described are simply distributed down
     the column instead of pooled at one end of it. A phone keeps the floating
     card, which is styles/mobile.css's call and is right there.

     The contact sheet — the alternate photographs, which 13 of the 45 products
     have — used to be a third column down the left edge. It is inside the
     reading panel now, under the description and above the rule, because it is
     something the panel SAYS about the dish rather than an index parked beside
     it. Everything above that rule is about this dish; everything below it is a
     move.

     WHY THERE IS NO WALK BAR IN THIS FILE (round 3, kept). It used to live down
     here, outside [data-detail-body], so that its listeners were bound once
     rather than on every product. It has moved INSIDE the reading panel — under the 1px rule,
     above the way back to the menu — because a blind judge charged the losing
     entry with "both CTAs point the customer away from the food", and a room
     whose only action is VOLVER AL MENU has exactly that fault. The primary
     move in a menu is the next dish.

     Binding is not the reason it had to stay outside. Every control in the body
     is now reached by ONE delegated listener on the dialog itself (detail.js),
     so nothing is re-bound when the body is replaced, and a control that is
     rebuilt 45 times is still bound zero times.

     Every string is an approved ui.json key, composed in detail.js from the same
     keys this file used. No sentence is written in either place, and the
     product's own line comes from menu.json or is absent. -->
<dialog class="detail" data-detail aria-labelledby="detail-name" aria-label="{{t:navMenu}}">
  <!-- First, so that the browser's own showModal() focus lands on the way out
       rather than on whatever control happens to be first inside the body. -->
  <button class="detail__close" type="button" data-detail-close aria-label="{{t:close}}">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <div class="detail__body" data-detail-body></div>
</dialog>
